<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#090d16"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <pattern id="grid-large" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#grid-large)"/>
  <circle cx="800" cy="450" r="300" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <path d="M 100 450 Q 800 200 1500 450 T 800 700 Z" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.4"/>
  <text x="800" y="430" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="32" font-weight="bold">SOLANA MASTERPLAN BLUEPRINT</text>
  <text x="800" y="480" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="600">Drop high-res masterplan.jpg here to update layout</text>
</svg>